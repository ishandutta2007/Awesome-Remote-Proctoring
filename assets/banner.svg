<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0a0e1a"/>
    </linearGradient>

    <!-- Accent Glow Gradient -->
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <!-- Radar Sweep Gradient -->
    <linearGradient id="radarSweep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>

    <!-- Radial Glow Behind Radar -->
    <radialGradient id="radarCenterGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.35"/>
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.4"/>
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="subtleGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes radarRotate {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes pulseRing {
        0% { r: 45px; opacity: 0.8; }
        50% { r: 90px; opacity: 0.25; }
        100% { r: 130px; opacity: 0; }
      }
      @keyframes blinkDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.25; transform: scale(0.8); }
      }
      .radar-needle {
        transform-origin: 1020px 200px;
        animation: radarRotate 4s linear infinite;
      }
      .pulse-1 {
        animation: pulseRing 3s cubic-bezier(0.2, 0.8, 0.4, 1) infinite;
      }
      .pulse-2 {
        animation: pulseRing 3s cubic-bezier(0.2, 0.8, 0.4, 1) infinite 1.5s;
      }
      .blinking {
        animation: blinkDot 1.5s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>

  <!-- Tech Grid Background -->
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Top Accent Border -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accentGlow)"/>

  <!-- Outer Frame Cyber Borders -->
  <rect x="20" y="20" width="1160" height="360" rx="16" fill="none" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="24" y="24" width="1152" height="352" rx="14" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.15"/>

  <!-- Corner Brackets -->
  <path d="M 20 55 L 20 20 L 55 20" fill="none" stroke="#38bdf8" stroke-width="3"/>
  <path d="M 1180 55 L 1180 20 L 1145 20" fill="none" stroke="#38bdf8" stroke-width="3"/>
  <path d="M 20 345 L 20 380 L 55 380" fill="none" stroke="#38bdf8" stroke-width="3"/>
  <path d="M 1180 345 L 1180 380 L 1145 380" fill="none" stroke="#38bdf8" stroke-width="3"/>

  <!-- Radar HUD Display on Right -->
  <g transform="translate(0, 0)">
    <circle cx="1020" cy="200" r="140" fill="url(#radarCenterGlow)"/>
    <circle cx="1020" cy="200" r="130" fill="none" stroke="#1e293b" stroke-width="1.5"/>
    <circle cx="1020" cy="200" r="95" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="4 4"/>
    <circle cx="1020" cy="200" r="60" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="1020" cy="200" r="25" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.8"/>

    <circle cx="1020" cy="200" r="45" fill="none" stroke="#38bdf8" stroke-width="1.5" class="pulse-1"/>
    <circle cx="1020" cy="200" r="45" fill="none" stroke="#818cf8" stroke-width="1.5" class="pulse-2"/>

    <line x1="880" y1="200" x2="1160" y2="200" stroke="#334155" stroke-width="1" stroke-opacity="0.6"/>
    <line x1="1020" y1="60" x2="1020" y2="340" stroke="#334155" stroke-width="1" stroke-opacity="0.6"/>

    <g class="radar-needle">
      <path d="M 1020 200 L 1150 160 A 135 135 0 0 0 1020 65 Z" fill="url(#radarSweep)"/>
      <line x1="1020" y1="200" x2="1150" y2="160" stroke="#38bdf8" stroke-width="2" filter="url(#glow)"/>
    </g>

    <circle cx="985" cy="155" r="4" fill="#22c55e" filter="url(#subtleGlow)"/>
    <circle cx="1075" cy="170" r="4" fill="#38bdf8" filter="url(#subtleGlow)"/>
    <circle cx="1040" cy="265" r="3.5" fill="#f59e0b" filter="url(#subtleGlow)"/>
    <circle cx="960" cy="235" r="3" fill="#a855f7" filter="url(#subtleGlow)"/>

    <circle cx="1020" cy="200" r="5" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="1020" cy="200" r="2" fill="#ffffff"/>
  </g>

  <!-- Left/Center Main Content -->
  <g transform="translate(60, 0)">
    <g transform="translate(0, 55)">
      <rect x="0" y="0" width="260" height="30" rx="15" fill="#0f172a" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5"/>
      <circle cx="18" cy="15" r="5" fill="#10b981" class="blinking" filter="url(#subtleGlow)"/>
      <text x="32" y="19" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5">LIVE AI PROCTORING ACTIVE</text>
    </g>

    <g transform="translate(0, 138)">
      <text x="0" y="0" fill="url(#accentGlow)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5" filter="url(#subtleGlow)">
        Awesome Remote Proctoring
      </text>
    </g>

    <g transform="translate(0, 185)">
      <text x="0" y="0" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500">
        Curated Guide to Online Exam Integrity, Anti-Cheating AI &amp; Invigilation Tech
      </text>
      <text x="0" y="26" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400">
        SaaS Market Intelligence • Open-Source Repositories • Lockdown Browsers • Biometric Verification
      </text>
    </g>

    <g transform="translate(0, 260)">
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="145" height="36" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3"/>
        <circle cx="18" cy="18" r="4" fill="#38bdf8"/>
        <text x="30" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">AI Vision &amp; Gaze</text>
      </g>
      <g transform="translate(155, 0)">
        <rect x="0" y="0" width="165" height="36" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#818cf8" stroke-width="1" stroke-opacity="0.3"/>
        <circle cx="18" cy="18" r="4" fill="#818cf8"/>
        <text x="30" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Browser Lockdown</text>
      </g>
      <g transform="translate(330, 0)">
        <rect x="0" y="0" width="155" height="36" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#a855f7" stroke-width="1" stroke-opacity="0.3"/>
        <circle cx="18" cy="18" r="4" fill="#a855f7"/>
        <text x="30" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Audio Analytics</text>
      </g>
      <g transform="translate(495, 0)">
        <rect x="0" y="0" width="160" height="36" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#10b981" stroke-width="1" stroke-opacity="0.3"/>
        <circle cx="18" cy="18" r="4" fill="#10b981"/>
        <text x="30" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">ID &amp; Biometrics</text>
      </g>
    </g>

    <g transform="translate(0, 315)">
      <text x="0" y="16" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="1">AUDIO FLAGGING STREAM:</text>
      <g transform="translate(180, -2)">
        <rect x="0" y="14" width="4" height="12" rx="2" fill="#38bdf8"/>
        <rect x="8" y="10" width="4" height="18" rx="2" fill="#38bdf8"/>
        <rect x="16" y="6" width="4" height="24" rx="2" fill="#818cf8"/>
        <rect x="24" y="12" width="4" height="16" rx="2" fill="#38bdf8"/>
        <rect x="32" y="4" width="4" height="28" rx="2" fill="#f43f5e"/>
        <rect x="40" y="10" width="4" height="18" rx="2" fill="#818cf8"/>
        <rect x="48" y="15" width="4" height="10" rx="2" fill="#38bdf8"/>
        <rect x="56" y="8" width="4" height="20" rx="2" fill="#38bdf8"/>
        <rect x="64" y="14" width="4" height="12" rx="2" fill="#10b981"/>
        <rect x="72" y="11" width="4" height="16" rx="2" fill="#38bdf8"/>
        <text x="86" y="18" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">NORMAL AMBIENT (NO WHISPER)</text>
      </g>
    </g>
  </g>
</svg>